
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SorenAI</title>

<style>
:root{
 --bg:#000;
 --panel:#111114;
 --panel2:#19191f;
 --text:#f5f5f7;
 --muted:#898995;
 --purple:#8755ff;
 --border:#292930;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 height:100dvh;
 overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{
 height:100dvh;
 display:flex;
 flex-direction:column;
 padding-top:env(safe-area-inset-top);
 padding-bottom:env(safe-area-inset-bottom);
}
header{
 height:68px;
 display:flex;
 align-items:center;
 padding:0 19px;
 gap:22px;
 flex-shrink:0;
}
.icon{
 border:0;
 background:none;
 color:white;
 font-size:24px;
}
.brand{
 font-size:25px;
 font-weight:700;
 letter-spacing:-1px;
}
.brand span{color:var(--purple)}
.settings-button{margin-left:auto}
main{
 flex:1;
 min-height:0;
 display:flex;
 justify-content:center;
 padding:15px 18px;
 overflow:hidden;
}
.welcome{
 align-self:center;
 text-align:center;
 font-size:27px;
 letter-spacing:-1px;
 color:#ededf1;
}
#messages{
 width:100%;
 max-width:800px;
 overflow-y:auto;
 display:none;
 flex-direction:column;
 gap:20px;
 padding:15px 0 25px;
}
.message{
 max-width:90%;
 font-size:16px;
 line-height:1.6;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 align-self:flex-end;
 background:#24212f;
 padding:12px 16px;
 border-radius:18px;
}
.assistant{
 align-self:flex-start;
 padding:6px 2px;
}
.message img{
 display:block;
 max-width:min(260px,100%);
 max-height:320px;
 object-fit:contain;
 border-radius:12px;
 margin-top:10px;
}
.generated-image{
 max-width:100%;
 border-radius:14px;
 margin-top:10px;
}
.composer{
 padding:12px 15px 15px;
 flex-shrink:0;
}
.input-box{
 display:flex;
 align-items:center;
 gap:9px;
 min-height:62px;
 padding:8px 10px;
 background:#111114;
 border:1px solid #34343c;
 border-radius:28px;
}
.input-box button{
 border:0;
 flex-shrink:0;
}
.action{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#25252c;
 color:white;
 font-size:22px;
}
#prompt{
 flex:1;
 min-width:0;
 border:0;
 outline:none;
 background:transparent;
 color:white;
 font-size:16px;
}
#prompt::placeholder{color:#858590}
.send{
 width:43px;
 height:43px;
 border-radius:50%;
 background:var(--purple);
 color:white;
 font-size:20px;
}
.tools{
 display:flex;
 gap:9px;
 padding:10px 5px 0;
}
.tools button{
 background:none;
 border:0;
 color:#92929e;
 font-size:13px;
}
.tools button:active{color:var(--purple)}
.preview{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:8px 3px;
}
.preview img{
 width:65px;
 height:65px;
 object-fit:cover;
 border-radius:10px;
}
nav{
 height:57px;
 display:flex;
 border-top:1px solid #1c1c22;
 flex-shrink:0;
}
nav button{
 flex:1;
 background:none;
 border:0;
 color:#858590;
 font-size:13px;
}
nav button.active{color:#a47bff}
nav span{
 display:block;
 font-size:21px;
 margin-bottom:3px;
}
.overlay{
 position:fixed;
 inset:0;
 z-index:20;
 background:#000b;
 display:none;
}
.overlay.open{display:block}
.panel{
 position:absolute;
 inset:0;
 background:#09090b;
 padding:23px;
 display:flex;
 flex-direction:column;
 gap:17px;
 overflow-y:auto;
}
.panel-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 font-size:22px;
 margin-bottom:8px;
}
.close{
 background:none;
 border:0;
 color:white;
 font-size:27px;
}
.field{
 display:flex;
 flex-direction:column;
 gap:8px;
}
.field label{
 color:#aaaab5;
 font-size:13px;
}
.field input,.field textarea{
 width:100%;
 padding:13px;
 background:#151519;
 border:1px solid #303038;
 border-radius:11px;
 color:white;
 outline:none;
}
.primary,.secondary,.history-item{
 padding:14px;
 border-radius:11px;
 text-align:center;
}
.primary{
 border:0;
 background:var(--purple);
 color:white;
}
.secondary,.history-item{
 border:1px solid #303038;
 background:#151519;
 color:white;
}
.history-item{text-align:left}
.status{font-size:12px;color:#999;line-height:1.5}
#attachmentMenu{
 position:absolute;
 bottom:115px;
 left:18px;
 background:#19191f;
 border:1px solid #33333c;
 border-radius:14px;
 padding:8px;
 display:none;
 flex-direction:column;
 min-width:190px;
 z-index:15;
}
#attachmentMenu.open{display:flex}
#attachmentMenu button{
 padding:13px;
 background:none;
 border:0;
 color:white;
 text-align:left;
}
.recording{color:#ff7777!important}
@media(min-width:700px){
 .panel{left:auto;width:410px;border-left:1px solid #292930}
 .composer{padding-left:12%;padding-right:12%}
}
</style>
</head>

<body>
<div class="app">

<header>
 <button class="icon" onclick="openHistory()">☰</button>
 <div class="brand">Soren<span>AI</span></div>
 <button class="icon settings-button" onclick="openSettings()">⚙</button>
</header>

<main>
 <div class="welcome" id="welcome">¿En qué podemos ayudarte?</div>
 <div id="messages"></div>
</main>

<div class="composer">

 <div class="preview" id="preview"></div>

 <div class="input-box">
  <button class="action" onclick="toggleAttachments()">+</button>
  <input id="prompt" placeholder="Escribe un mensaje..." autocomplete="off">
  <button class="action" id="micButton" onclick="toggleRecording()">♩</button>
  <button class="send" onclick="sendMessage()">➤</button>
 </div>

 <div class="tools">
  <button onclick="generateImage()">Crear imagen</button>
  <button onclick="openCamera()">Cámara</button>
  <button onclick="openGallery()">Galería</button>
 </div>
</div>

<nav>
 <button class="active" onclick="newChat()">
  <span>▢</span>Chats
 </button>
</nav>
</div>

<div id="attachmentMenu">
 <button onclick="openGallery()">Seleccionar imagen</button>
 <button onclick="openCamera()">Tomar fotografía</button>
 <button onclick="toggleRecording()">Grabar audio</button>
 <button onclick="toggleAttachments()">Cerrar</button>
</div>

<input id="gallery" type="file" accept="image/*" multiple hidden>
<input id="camera" type="file" accept="image/*" capture="environment" hidden>

<div class="overlay" id="settings">
 <div class="panel">
  <div class="panel-title">
   <span>Ajustes</span>
   <button class="close" onclick="closePanels()">×</button>
  </div>

  <div class="field">
   <label>API KEY</label>
   <input id="apiKey" type="password" placeholder="Introduce tu API key">
  </div>

  <div class="field">
   <label>Endpoint del chat</label>
   <input id="chatEndpoint" value="https://api.openai.com/v1/chat/completions">
  </div>

  <div class="field">
   <label>Modelo de chat</label>
   <input id="chatModel" value="gpt-4o-mini">
  </div>

  <div class="field">
   <label>Endpoint de generación de imágenes</label>
   <input id="imageEndpoint" value="https://api.openai.com/v1/images/generations">
  </div>

  <div class="field">
   <label>Modelo de imágenes</label>
   <input id="imageModel" value="gpt-image-1">
  </div>

  <div class="field">
   <label>Endpoint de transcripción de audio</label>
   <input id="audioEndpoint" value="https://api.openai.com/v1/audio/transcriptions">
  </div>

  <div class="field">
   <label>Modelo de audio</label>
   <input id="audioModel" value="whisper-1">
  </div>

  <button class="primary" onclick="saveSettings()">Guardar configuración</button>
  <button class="secondary" onclick="testConnection()">Probar conexión</button>
  <button class="secondary" onclick="clearConfiguration()">Eliminar configuración</button>

  <p class="status" id="status">Configuración local del dispositivo.</p>
  <p class="status">Los proveedores deben admitir los formatos y endpoints seleccionados. La API puede generar costos.</p>
 </div>
</div>

<div class="overlay" id="historyPanel">
 <div class="panel">
  <div class="panel-title">
   <span>Conversaciones</span>
   <button class="close" onclick="closePanels()">×</button>
  </div>
  <button class="primary" onclick="newChat();closePanels()">+ Nuevo chat</button>
  <div id="historyList"></div>
 </div>
</div>

<script>
/* CONFIGURACIÓN INICIAL
   También puedes dejar tu configuración vacía
   y cambiarla desde Ajustes.
*/
const CONFIG={
 API_KEY:"AQ.Ab8RN6I6xV5Zpg5gA-l__nYSN-rUD7JQ7GkpGbiX2abXb81WNQ",
 CHAT_ENDPOINT:"https://api.openai.com/v1/chat/completions",
 CHAT_MODEL:"gpt-4o-mini",
 IMAGE_ENDPOINT:"https://api.openai.com/v1/images/generations",
 IMAGE_MODEL:"gpt-image-1",
 AUDIO_ENDPOINT:"https://api.openai.com/v1/audio/transcriptions",
 AUDIO_MODEL:"whisper-1"
};

const $=id=>document.getElementById(id);

let selectedImages=[];
let chats=JSON.parse(localStorage.getItem("soren_history")||"[]");
let currentChat=null;
let recorder=null;
let audioChunks=[];
let recordedBlob=null;

function config(name,defaultValue){
 return localStorage.getItem("soren_"+name)||defaultValue;
}

function getConfig(){
 return {
  key:config("key",CONFIG.API_KEY),
  chat:config("chat",CONFIG.CHAT_ENDPOINT),
  model:config("model",CONFIG.CHAT_MODEL),
  image:config("image",CONFIG.IMAGE_ENDPOINT),
  imageModel:config("imageModel",CONFIG.IMAGE_MODEL),
  audio:config("audio",CONFIG.AUDIO_ENDPOINT),
  audioModel:config("audioModel",CONFIG.AUDIO_MODEL)
 };
}

function saveSettings(){
 const fields={
  key:$("apiKey").value.trim(),
  chat:$("chatEndpoint").value.trim(),
  model:$("chatModel").value.trim(),
  image:$("imageEndpoint").value.trim(),
  imageModel:$("imageModel").value.trim(),
  audio:$("audioEndpoint").value.trim(),
  audioModel:$("audioModel").value.trim()
 };

 Object.entries(fields).forEach(([k,v])=>{
  localStorage.setItem("soren_"+k,v);
 });

 $("status").textContent="Configuración guardada.";
}

function openSettings(){
 closePanels();
 const c=getConfig();
 $("apiKey").value=c.key;
 $("chatEndpoint").value=c.chat;
 $("chatModel").value=c.model;
 $("imageEndpoint").value=c.image;
 $("imageModel").value=c.imageModel;
 $("audioEndpoint").value=c.audio;
 $("audioModel").value=c.audioModel;
 $("settings").classList.add("open");
}

function clearConfiguration(){
 Object.keys(localStorage).filter(k=>k.startsWith("soren_"))
 .forEach(k=>localStorage.removeItem(k));
 $("apiKey").value="";
 $("status").textContent="Configuración eliminada.";
}

function closePanels(){
 $("settings").classList.remove("open");
 $("historyPanel").classList.remove("open");
 $("attachmentMenu").classList.remove("open");
}

function toggleAttachments(){
 $("attachmentMenu").classList.toggle("open");
}

function openHistory(){
 renderHistory();
 $("historyPanel").classList.add("open");
}

function newChat(){
 currentChat={id:Date.now(),messages:[]};
 chats.unshift(currentChat);
 saveHistory();
 renderMessages();
}

function saveHistory(){
 localStorage.setItem("soren_history",JSON.stringify(chats));
 renderHistory();
}

function renderHistory(){
 $("historyList").innerHTML="";
 chats.forEach(chat=>{
  const b=document.createElement("button");
  b.className="history-item";
  b.style.width="100%";
  b.style.marginBottom="8px";
  b.textContent=chat.messages[0]?.text?.slice(0,40)||"Nuevo chat";
  b.onclick=()=>{
   currentChat=chat;
   renderMessages();
   closePanels();
  };
  $("historyList").appendChild(b);
 });
}

function addMessage(text,role,images=[]){
 const div=document.createElement("div");
 div.className="message "+role;
 div.textContent=text||"";

 images.forEach(src=>{
  const img=document.createElement("img");
  img.src=src;
  div.appendChild(img);
 });

 $("messages").appendChild(div);
 $("messages").scrollTop=$("messages").scrollHeight;
}

function renderMessages(){
 $("messages").innerHTML="";
 if(!currentChat||!currentChat.messages.length){
  $("messages").style.display="none";
  $("welcome").style.display="block";
  return;
 }

 $("welcome").style.display="none";
 $("messages").style.display="flex";

 currentChat.messages.forEach(m=>{
  addMessage(m.text,m.role,m.images||[]);
 });
}

function openGallery(){
 closePanels();
 $("gallery").click();
}

function openCamera(){
 closePanels();
 $("camera").click();
}

async function processImages(files){
 for(const file of files){
  if(!file.type.startsWith("image/"))continue;
  if(file.size>8*1024*1024){
   alert("La imagen supera los 8 MB.");
   continue;
  }

  const src=await new Promise(resolve=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(reader.result);
   reader.readAsDataURL(file);
  });

  selectedImages.push(src);
 }
 renderPreview();
}

$("gallery").addEventListener("change",e=>{
 processImages([...e.target.files]);
 e.target.value="";
});

$("camera").addEventListener("change",e=>{
 processImages([...e.target.files]);
 e.target.value="";
});

function renderPreview(){
 $("preview").innerHTML="";
 selectedImages.forEach(src=>{
  const img=document.createElement("img");
  img.src=src;
  $("preview").appendChild(img);
 });
}

async function sendMessage(){
 const text=$("prompt").value.trim();
 if(!text&&!selectedImages.length)return;

 const c=getConfig();
 if(!c.key){
  openSettings();
  $("status").textContent="Primero configura tu API KEY.";
  return;
 }

 if(!currentChat)newChat();

 const images=[...selectedImages];
 selectedImages=[];
 renderPreview();
 $("prompt").value="";

 currentChat.messages.push({
  role:"user",text,images
 });

 renderMessages();

 const loading=document.createElement("div");
 loading.className="message assistant";
 loading.textContent="SorenAI está pensando...";
 $("messages").appendChild(loading);

 try{
  const history=currentChat.messages.map(m=>{
   if(m.role==="assistant")return {role:"assistant",content:m.text};

   const content=[];
   if(m.text)content.push({type:"text",text:m.text});
   (m.images||[]).forEach(src=>{
    content.push({type:"image_url",image_url:{url:src}});
   });

   return {role:"user",content:content.length?content:m.text};
  });

  const response=await fetch(c.chat,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+c.key
   },
   body:JSON.stringify({
    model:c.model,
    messages:history
   })
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||response.status);

  const answer=data.choices?.[0]?.message?.content;
  if(typeof answer!=="string")throw new Error("Respuesta no compatible.");

  currentChat.messages.push({role:"assistant",text:answer});
  loading.remove();
  renderMessages();
  saveHistory();

 }catch(e){
  loading.textContent="Error: "+e.message;
 }
}

$("prompt").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

/* GENERACIÓN DE IMÁGENES */

async function generateImage(){
 const prompt=$("prompt").value.trim();
 if(!prompt){
  alert("Escribe una descripción de la imagen.");
  return;
 }

 const c=getConfig();
 if(!c.key){
  openSettings();
  return;
 }

 if(!currentChat)newChat();

 $("prompt").value="";
 currentChat.messages.push({role:"user",text:"Crear imagen: "+prompt});
 renderMessages();

 const loading=document.createElement("div");
 loading.className="message assistant";
 loading.textContent="Generando imagen...";
 $("messages").appendChild(loading);

 try{
  const response=await fetch(c.image,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+c.key
   },
   body:JSON.stringify({
    model:c.imageModel,
    prompt:prompt,
    size:"1024x1024"
   })
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||response.status);

  const result=data.data?.[0];
  let imageUrl=result?.url;

  if(result?.b64_json){
   imageUrl="data:image/png;base64,"+result.b64_json;
  }

  if(!imageUrl)throw new Error("El proveedor no devolvió una imagen.");

  currentChat.messages.push({
   role:"assistant",
   text:"Imagen generada:",
   images:[imageUrl]
  });

  loading.remove();
  renderMessages();
  saveHistory();

 }catch(e){
  loading.textContent="Error al generar: "+e.message;
 }
}

/* GRABACIÓN DE AUDIO */

async function toggleRecording(){
 if(recorder&&recorder.state==="recording"){
  recorder.stop();
  $("micButton").classList.remove("recording");
  $("micButton").textContent="♩";
  return;
 }

 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  alert("Tu navegador no permite grabar audio.");
  return;
 }

 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioChunks=[];

  const mime=MediaRecorder.isTypeSupported("audio/webm")
   ?"audio/webm":"audio/mp4";

  recorder=new MediaRecorder(stream,{mimeType:mime});

  recorder.ondataavailable=e=>{
   if(e.data.size)audioChunks.push(e.data);
  };

  recorder.onstop=async()=>{
   const blob=new Blob(audioChunks,{type:mime});
   stream.getTracks().forEach(t=>t.stop());
   await transcribeAudio(blob);
  };

  recorder.start();
  $("micButton").classList.add("recording");
  $("micButton").textContent="■";

 }catch(e){
  alert("No se pudo acceder al micrófono: "+e.message);
 }
}

async function transcribeAudio(blob){
 const c=getConfig();

 if(!c.key){
  alert("Configura tu API KEY primero.");
  return;
 }

 if(!currentChat)newChat();

 const loading=document.createElement("div");
 loading.className="message assistant";
 loading.textContent="Transcribiendo audio...";
 $("messages").appendChild(loading);

 try{
  const form=new FormData();
  form.append("file",blob,"recording.webm");
  form.append("model",c.audioModel);

  const response=await fetch(c.audio,{
   method:"POST",
   headers:{"Authorization":"Bearer "+c.key},
   body:form
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||response.status);

  loading.remove();
  $("prompt").value=data.text||"";
  if($("prompt").value)await sendMessage();

 }catch(e){
  loading.textContent="Error de audio: "+e.message;
 }
}

/* PRUEBA DE CONEXIÓN */

async function testConnection(){
 saveSettings();
 const c=getConfig();

 $("status").textContent="Comprobando conexión...";

 try{
  const response=await fetch(c.chat,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+c.key
   },
   body:JSON.stringify({
    model:c.model,
    messages:[{role:"user",content:"Responde OK"}]
   })
  });

  if(!response.ok)throw new Error("HTTP "+response.status);

  $("status").textContent="Conexión correcta.";
 }catch(e){
  $("status").textContent="No se pudo conectar: "+e.message;
 }
}

renderHistory();
</script>
</body>
</html>
