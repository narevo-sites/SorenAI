
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>SorenAI</title>

<style>
:root {
  --bg:#050505;
  --panel:#111114;
  --border:#29292f;
  --purple:#8955ff;
  --text:#f5f5f7;
  --muted:#92929d;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  height:100dvh;
  overflow:hidden;
}
button,textarea,input {font:inherit}
button {cursor:pointer;color:inherit}
header {
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  border-bottom:1px solid #19191e;
}
.brand {
  font-size:25px;
  font-weight:750;
  letter-spacing:-1px;
}
.brand span {color:var(--purple)}
.icon {
  border:0;
  background:transparent;
  font-size:25px;
  padding:8px;
}
main {
  height:calc(100dvh - 215px);
  overflow-y:auto;
  padding:20px 16px;
}
#welcome {
  text-align:center;
  margin-top:18vh;
}
#welcome h1 {
  font-size:26px;
  letter-spacing:-1px;
}
#welcome p {color:var(--muted)}
#messages {
  display:flex;
  flex-direction:column;
  gap:16px;
}
.message {
  max-width:90%;
  padding:13px 16px;
  border-radius:18px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user {
  align-self:flex-end;
  background:#252130;
}
.ai {
  align-self:flex-start;
  background:#111114;
  border:1px solid #29292f;
}
.message img {
  display:block;
  max-width:100%;
  border-radius:12px;
  margin-top:10px;
}
#composer-area {
  position:absolute;
  bottom:65px;
  left:0;
  right:0;
  padding:12px 16px 8px;
  background:linear-gradient(transparent,#050505 12%);
}
.composer {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--panel);
  border:1px solid #34343b;
  border-radius:30px;
  padding:8px;
  min-height:65px;
}
.circle {
  width:47px;
  height:47px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:#25252b;
  font-size:22px;
}
#prompt {
  flex:1;
  min-width:0;
  max-height:110px;
  resize:none;
  border:0;
  outline:0;
  color:white;
  background:transparent;
  padding:12px 3px;
}
#send {
  background:var(--purple);
  font-size:22px;
}
.tools {
  display:flex;
  gap:17px;
  padding:12px 8px 0;
  color:var(--muted);
  font-size:14px;
}
.tools button {
  border:0;
  background:none;
  color:inherit;
  padding:0;
}
#status {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding-top:9px;
}
footer {
  position:absolute;
  bottom:0;
  height:65px;
  width:100%;
  border-top:1px solid #19191e;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aa8cff;
}
.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#000c;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.modal-box {
  width:100%;
  max-width:420px;
  background:#151519;
  border:1px solid #33333c;
  border-radius:20px;
  padding:20px;
}
.modal-box h2 {margin-top:0}
.modal-box input {
  width:100%;
  background:#09090c;
  color:white;
  border:1px solid #393942;
  border-radius:11px;
  padding:14px;
  outline:none;
}
.modal-box button {
  padding:12px 16px;
  border:0;
  border-radius:10px;
  background:var(--purple);
}
.modal-actions {
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}
.secondary {background:#303038!important}
.small {
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
#imageInput,#cameraInput {display:none}
</style>
</head>

<body>

<header>
  <button class="icon" id="newChat">☰</button>
  <div class="brand">Soren<span>AI</span></div>
  <button class="icon" id="settingsBtn">⚙</button>
</header>

<main id="main">
  <section id="welcome">
    <h1>¿En qué podemos ayudarte?</h1>
    <p>Tu espacio de inteligencia artificial.</p>
  </section>
  <div id="messages"></div>
</main>

<div id="composer-area">
  <div class="composer">
    <button class="circle" id="galleryPlus">+</button>
    <textarea id="prompt" rows="1"
      placeholder="Escribe un mensaje..."></textarea>
    <button class="circle" id="micBtn">●</button>
    <button class="circle" id="send">➤</button>
  </div>

  <div class="tools">
    <button id="imageBtn">Crear imagen</button>
    <button id="cameraBtn">Cámara</button>
    <button id="galleryBtn">Galería</button>
  </div>

  <div id="status">Gemini no está configurado</div>
</div>

<footer>Chats</footer>

<input type="file" id="imageInput" accept="image/*">
<input type="file" id="cameraInput" accept="image/*" capture="environment">

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>Configuración</h2>
    <p class="small">Conexión exclusiva con Google Gemini.</p>

    <label>API KEY de Gemini</label>
    <input id="apiKeyInput" type="password"
      placeholder="Pega tu API KEY">

    <p class="small">
      Modelo de chat: gemini-3.8-flash
      <br>
      Modelo de imágenes: gemini-3.1-flash-image
    </p>

    <div class="modal-actions">
      <button class="secondary" id="closeSettings">Cancelar</button>
      <button id="saveSettings">Guardar</button>
    </div>
  </div>
</div>

<script>
/* =================================
   CONFIGURACIÓN EXCLUSIVA GEMINI
================================= */

const CONFIG = {
  API_URL:
    "https://generativelanguage.googleapis.com/v1beta/models/",

  CHAT_MODEL:
    "gemini-3.8-flash",

  IMAGE_MODEL:
    "gemini-3.1-flash-image"
};

let API_KEY =
  localStorage.getItem("soren_gemini_key") || "";

let conversation = [];
let pendingImage = null;
let recorder = null;
let audioChunks = [];
let recording = false;

const $ = id => document.getElementById(id);

const messages = $("messages");
const promptBox = $("prompt");
const welcome = $("welcome");
const statusBox = $("status");

function status(text) {
  statusBox.textContent = text;
}

/* =================================
   AJUSTES
================================= */

function openSettings() {
  $("apiKeyInput").value = API_KEY;
  $("settingsModal").style.display = "flex";
}

$("settingsBtn").onclick = openSettings;

$("closeSettings").onclick = () => {
  $("settingsModal").style.display = "none";
};

$("saveSettings").onclick = () => {
  const key = $("apiKeyInput").value.trim();

  if (!key) {
    alert("Introduce tu API KEY de Gemini.");
    return;
  }

  API_KEY = key;
  localStorage.setItem("soren_gemini_key", key);

  $("settingsModal").style.display = "none";
  status("API KEY de Gemini guardada");
};

/* =================================
   NUEVO CHAT
================================= */

$("newChat").onclick = () => {
  if (!confirm("¿Iniciar una conversación nueva?")) return;

  conversation = [];
  pendingImage = null;
  messages.innerHTML = "";
  welcome.style.display = "block";
  promptBox.value = "";
  status("Conversación nueva");
};

/* =================================
   INTERFAZ
================================= */

function addMessage(text, type, imageUrl = null) {
  welcome.style.display = "none";

  const div = document.createElement("div");
  div.className = "message " + type;

  const content = document.createElement("div");
  content.textContent = text;
  div.appendChild(content);

  if (imageUrl) {
    const img = document.createElement("img");
    img.src = imageUrl;
    div.appendChild(img);
  }

  messages.appendChild(div);
  $("main").scrollTop = $("main").scrollHeight;

  return div;
}

/* =================================
   CONEXIÓN GOOGLE GEMINI
================================= */

function checkKey() {
  if (!API_KEY) {
    openSettings();
    throw new Error("Configura tu API KEY de Gemini.");
  }
}

async function geminiRequest(model, contents, generationConfig = {}) {
  checkKey();

  const url =
    CONFIG.API_URL +
    model +
    ":generateContent";

  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": API_KEY
    },
    body: JSON.stringify({
      contents: contents,
      generationConfig: generationConfig
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error?.message ||
      "No se pudo conectar con Gemini."
    );
  }

  return data;
}

function responseParts(data) {
  return data.candidates?.[0]?.content?.parts || [];
}

function extractText(parts) {
  return parts
    .filter(part => part.text)
    .map(part => part.text)
    .join("\n");
}

function extractImage(parts) {
  return parts.find(part =>
    part.inlineData?.mimeType?.startsWith("image/")
  );
}

function imageToUrl(part) {
  return "data:" +
    part.inlineData.mimeType +
    ";base64," +
    part.inlineData.data;
}

/* =================================
   CHAT
================================= */

async function sendMessage(extraParts = []) {
  const text = promptBox.value.trim();

  if (!text && extraParts.length === 0) return;

  try {
    checkKey();

    const parts = [
      ...extraParts,
      ...(text ? [{text:text}] : [])
    ];

    addMessage(
      text || "Archivo enviado",
      "user"
    );

    promptBox.value = "";
    pendingImage = null;

    conversation.push({
      role: "user",
      parts: parts
    });

    status("Gemini está pensando...");

    const data = await geminiRequest(
      CONFIG.CHAT_MODEL,
      conversation
    );

    const answerParts = responseParts(data);
    const answer = extractText(answerParts);
    const image = extractImage(answerParts);

    if (!answer && !image) {
      throw new Error(
        "Gemini no devolvió una respuesta."
      );
    }

    addMessage(
      answer || "Imagen recibida.",
      "ai",
      image ? imageToUrl(image) : null
    );

    conversation.push({
      role: "model",
      parts: answerParts
    });

    status("Conectado a Gemini");

  } catch (error) {
    addMessage("Error: " + error.message, "ai");
    status("Error de conexión");
  }
}

$("send").onclick = () => {
  if (pendingImage) {
    const image = pendingImage;
    pendingImage = null;
    sendMessage([image]);
  } else {
    sendMessage();
  }
};

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("send").click();
  }
});

/* =================================
   CÁMARA Y GALERÍA
================================= */

function fileToPart(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      resolve({
        inlineData: {
          mimeType: file.type,
          data: reader.result.split(",")[1]
        }
      });
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function selectImage(file) {
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Selecciona una imagen válida.");
    return;
  }

  try {
    pendingImage = await fileToPart(file);
    promptBox.value =
      promptBox.value || "Describe esta imagen.";

    status("Imagen preparada. Pulsa enviar.");
  } catch {
    status("No se pudo cargar la imagen.");
  }
}

$("galleryPlus").onclick = () =>
  $("imageInput").click();

$("galleryBtn").onclick = () =>
  $("imageInput").click();

$("cameraBtn").onclick = () =>
  $("cameraInput").click();

$("imageInput").onchange = async event => {
  await selectImage(event.target.files[0]);
  event.target.value = "";
};

$("cameraInput").onchange = async event => {
  await selectImage(event.target.files[0]);
  event.target.value = "";
};

/* =================================
   GENERACIÓN DE IMÁGENES GEMINI
================================= */

$("imageBtn").onclick = async () => {
  const description = promptBox.value.trim();

  if (!description) {
    alert("Escribe una descripción de la imagen.");
    return;
  }

  try {
    checkKey();

    addMessage(
      "Crear imagen: " + description,
      "user"
    );

    promptBox.value = "";
    status("Generando imagen con Gemini...");

    const data = await geminiRequest(
      CONFIG.IMAGE_MODEL,
      [{
        role: "user",
        parts: [{text:description}]
      }],
      {
        responseModalities: ["TEXT", "IMAGE"]
      }
    );

    const parts = responseParts(data);
    const image = extractImage(parts);
    const text = extractText(parts);

    if (!image) {
      throw new Error(
        text ||
        "El modelo no devolvió una imagen. Comprueba que tu clave tenga acceso a este modelo."
      );
    }

    addMessage(
      text || "Imagen generada.",
      "ai",
      imageToUrl(image)
    );

    status("Imagen generada con Gemini");

  } catch (error) {
    addMessage(
      "Error al generar imagen: " + error.message,
      "ai"
    );

    status("No se pudo generar la imagen");
  }
};

/* =================================
   AUDIO: GRABACIÓN
================================= */

async function convertToWav(blob) {
  const audioContext = new AudioContext();

  const original = await audioContext.decodeAudioData(
    await blob.arrayBuffer()
  );

  const targetRate = 16000;
  const ratio = original.sampleRate / targetRate;
  const length = Math.floor(original.length / ratio);
  const samples = new Float32Array(length);

  for (let i = 0; i < length; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(
      Math.floor((i + 1) * ratio),
      original.length
    );

    let total = 0;
    let count = 0;

    for (let j = start; j < end; j++) {
      for (
        let channel = 0;
        channel < original.numberOfChannels;
        channel++
      ) {
        total += original.getChannelData(channel)[j];
        count++;
      }
    }

    samples[i] = count ? total / count : 0;
  }

  const buffer = new ArrayBuffer(44 + length * 2);
  const view = new DataView(buffer);

  function write(offset, value) {
    for (let i = 0; i < value.length; i++) {
      view.setUint8(offset + i, value.charCodeAt(i));
    }
  }

  write(0, "RIFF");
  view.setUint32(4, 36 + length * 2, true);
  write(8, "WAVE");
  write(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, targetRate, true);
  view.setUint32(28, targetRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  write(36, "data");
  view.setUint32(40, length * 2, true);

  for (let i = 0; i < length; i++) {
    const value = Math.max(-1, Math.min(1, samples[i]));

    view.setInt16(
      44 + i * 2,
      value < 0 ? value * 32768 : value * 32767,
      true
    );
  }

  await audioContext.close();

  return new Blob([buffer], {
    type:"audio/wav"
  });
}

$("micBtn").onclick = async () => {
  if (recording) {
    recorder.stop();
    recording = false;
    $("micBtn").textContent = "●";
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    alert("El navegador no permite grabar audio aquí.");
    return;
  }

  try {
    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    audioChunks = [];
    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = event => {
      if (event.data.size) {
        audioChunks.push(event.data);
      }
    };

    recorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());

      try {
        status("Procesando grabación...");

        const recorded = new Blob(audioChunks, {
          type:recorder.mimeType
        });

        const wav = await convertToWav(recorded);
        const audioPart = await fileToPart(wav);

        await sendMessage([
          {
            text:"Escucha este audio, transcríbelo y responde a lo que se solicita."
          },
          audioPart
        ]);

      } catch (error) {
        addMessage(
          "Error de audio: " + error.message,
          "ai"
        );

        status("Error procesando audio");
      }
    };

    recorder.start();
    recording = true;
    $("micBtn").textContent = "■";
    status("Grabando... Pulsa para terminar.");

  } catch (error) {
    alert(
      "No se pudo acceder al micrófono. Revisa los permisos del navegador."
    );
  }
};

/* =================================
   INICIO
================================= */

if (API_KEY) {
  status("API KEY de Gemini configurada");
} else {
  status("Abre Ajustes para configurar Gemini");
}
</script>

</body>
</html>
